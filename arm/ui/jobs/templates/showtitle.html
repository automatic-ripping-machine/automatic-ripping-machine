{% extends "base.html" %}
{% block title %}Logs{% endblock %}

{% block nav %}{{ super() }}{% endblock %}

{% block content %}
<div class="container">
    <div class="row">
        <div class="col-sm-3"></div>
            <div class="col-sm-6 text-center">
                <div class="card text-center">
                    <div class="card-header"><a href="select_title?imdbID={{ results["imdbID"] }}&job_id={{ job_id }}"><img src="{{ results["Poster"] }}" width="240px" class="img-thumbnail" alt="Poster Image"></a></div>
                    <div class="card-body"><strong>{{  results["Title"]  }}</strong> - {{ results["Type"].capitalize() }} ({{ results["Year"] }})</div>
                    <div class="card-body"><strong>Full Plot:</strong> {{ results["Plot"] }}</div>
                    <div class="card-footer">
						<a href="titlesearch?job_id={{ job_id }}" class="btn btn-primary">New Search</a>   
                        <form action="{{ url_for('route_jobs.updatetitle') }}" method="post" class="d-inline">
                            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                            <input type="hidden" name="title" value="{{ results['Title'] }}">
                            <input type="hidden" name="year" value="{{ results['Year'] }}">
                            <input type="hidden" name="imdbID" value="{{ results['imdbID'] }}">
                            <input type="hidden" name="type" value="{{ results['Type'] }}">
                            <input type="hidden" name="poster" value="{{ results['Poster'] }}">
                            <input type="hidden" name="job_id" value="{{ job_id }}">
                            <button type="submit" class="btn btn-primary">Update Title</button>
                        </form>
                    </div>
                </div>
            </div>
        <div class="col-sm-3"></div>     
    </div>
</div>



{% endblock %}

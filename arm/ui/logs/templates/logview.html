{% extends "base.html" %}

{% block content %}
<h4>Loading log: {{ file }}...</h4>
<div id="container">

    <div id="log">
        <pre id="{{ file }}" ></pre>
    </div>
</div>
{% endblock %}
{% block footer %}{{ super() }}{% endblock %}
{% block js %}
{{ super() }}
<script src="{{ url_for('static', filename='js/logBuffer.js') }}"></script>
<script src="{{ url_for('static', filename='js/logReader.js') }}"></script>
<script>
    startLogReader({
        output: document.getElementById({{ file|tojson }}),
        mode: {{ mode|tojson }},
        url: '/logreader?logfile=' + encodeURIComponent({{ file|tojson }}) + '&mode=full'
    });
</script>
{% endblock %}

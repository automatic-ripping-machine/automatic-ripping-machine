[project]
name = "arm-devtools-mcp"
version = "1.0.0"
description = "MCP server over the ARM v3 /__devtools developer API"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.10,<2",
    "requests>=2",
]

[project.scripts]
arm-devtools-mcp = "armdevtools_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["armdevtools_mcp"]
